name: 06 - Scheduled Run

on:
  # Allows manual testing from the Actions tab
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

jobs:
  scheduled-task:
    runs-on: ubuntu-latest

    steps:
      - name: Run scheduled housekeeping
        run: |
          echo "Running scheduled job"
          echo "UTC time: $(date -u)"
          echo "India time: $(TZ=Asia/Kolkata date)"
