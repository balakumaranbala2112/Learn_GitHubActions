name: Secret Test

on:
  workflow_dispatch

jobs:
  test-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret
        run: |
          if [ -z "${{ secrets.MY_API_KEY }}" ]; then
            echo "❌ Secret not found"
            exit 1
          else
            echo "✅ Secret found (masked): ${{ secrets.MY_API_KEY }}"
          fi
